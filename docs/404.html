<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>404 — Off the map</title>
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo+Expanded:wght@700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{--ink:#0F1318;--paper:#E9ECEF;--muted:#828D99;--signal:#FF7A1A;--line:#27313C}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--ink);color:var(--paper);
    display:flex;align-items:center;justify-content:center;text-align:center;padding:28px;
    font-family:"JetBrains Mono",monospace;
    background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:64px 64px;background-position:center;}
  .box{max-width:520px}
  .code{font-size:13px;letter-spacing:.22em;color:var(--signal);text-transform:uppercase}
  h1{font-family:"Archivo Expanded",sans-serif;font-weight:800;font-size:clamp(4rem,18vw,9rem);
    margin:.1em 0;line-height:.9;letter-spacing:-.01em}
  p{color:var(--muted);font-size:14px;line-height:1.7;margin:0 0 30px}
  a{display:inline-block;color:var(--signal);border:1px solid rgba(255,122,26,.34);
    padding:11px 20px;border-radius:2px;font-size:13px;letter-spacing:.04em;text-decoration:none;transition:all .2s}
  a:hover{background:var(--signal);color:#0a0d10}
</style>
</head>
<body>
  <div class="box">
    <div class="code">// SIGNAL LOST</div>
    <h1>404</h1>
    <p>This location isn&rsquo;t on the map. The sensor returned no data for the path you requested.</p>
    <a href="/">← Return to start</a>
  </div>
</body>
</html>
