  <rect width="1200" height="630" fill="url(#veil)"/>

  <!-- text -->
  <text x="80" y="250" font-family="DejaVu Sans Mono" font-size="22" letter-spacing="8" fill="#FF7A1A">PERCEPTION · MOTION · CONTROL</text>
  <text x="76" y="360" font-family="DejaVu Sans" font-weight="bold" font-size="116" letter-spacing="2" fill="#E9ECEF">KUSHANT</text>
  <text x="76" y="470" font-family="DejaVu Sans" font-weight="bold" font-size="116" letter-spacing="2" fill="#E9ECEF">PATEL</text>
  <text x="80" y="545" font-family="DejaVu Sans Mono" font-size="24" letter-spacing="2" fill="#C3CAD2">Technology Engineer  /  Brookhaven National Laboratory</text>

  <rect x="80" y="190" width="34" height="3" fill="#FF7A1A"/>
</svg>
