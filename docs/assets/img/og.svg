  <!-- point cloud + scan -->
  <g>
    <circle cx="980" cy="150" r="3" fill="#FF7A1A"/><circle cx="1040" cy="220" r="2.4" fill="#FF7A1A" opacity="0.8"/>
    <circle cx="900" cy="200" r="2" fill="#B4C4D2" opacity="0.5"/><circle cx="1080" cy="300" r="3.2" fill="#FF7A1A" opacity="0.9"/>
    <circle cx="950" cy="320" r="2.2" fill="#B4C4D2" opacity="0.45"/><circle cx="1020" cy="380" r="2.6" fill="#FF7A1A" opacity="0.7"/>
    <circle cx="1110" cy="180" r="2" fill="#B4C4D2" opacity="0.4"/><circle cx="870" cy="280" r="2.4" fill="#FF7A1A" opacity="0.6"/>
    <circle cx="1060" cy="450" r="2.2" fill="#B4C4D2" opacity="0.5"/><circle cx="940" cy="430" r="2.8" fill="#FF7A1A" opacity="0.75"/>
    <circle cx="1120" cy="380" r="2" fill="#B4C4D2" opacity="0.4"/><circle cx="1000" cy="500" r="2.4" fill="#FF7A1A" opacity="0.6"/>
