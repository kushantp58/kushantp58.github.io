    <line x1="192" y1="0" x2="192" y2="630"/><line x1="256" y1="0" x2="256" y2="630"/>
    <line x1="320" y1="0" x2="320" y2="630"/><line x1="384" y1="0" x2="384" y2="630"/>
    <line x1="448" y1="0" x2="448" y2="630"/><line x1="512" y1="0" x2="512" y2="630"/>
    <line x1="576" y1="0" x2="576" y2="630"/><line x1="640" y1="0" x2="640" y2="630"/>
    <line x1="704" y1="0" x2="704" y2="630"/><line x1="768" y1="0" x2="768" y2="630"/>
    <line x1="832" y1="0" x2="832" y2="630"/><line x1="896" y1="0" x2="896" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/><line x1="1024" y1="0" x2="1024" y2="630"/>
    <line x1="1088" y1="0" x2="1088" y2="630"/><line x1="1152" y1="0" x2="1152" y2="630"/>
    <line x1="0" y1="64" x2="1200" y2="64"/><line x1="0" y1="128" x2="1200" y2="128"/>
    <line x1="0" y1="192" x2="1200" y2="192"/><line x1="0" y1="256" x2="1200" y2="256"/>
    <line x1="0" y1="320" x2="1200" y2="320"/><line x1="0" y1="384" x2="1200" y2="384"/>
    <line x1="0" y1="448" x2="1200" y2="448"/><line x1="0" y1="512" x2="1200" y2="512"/>
    <line x1="0" y1="576" x2="1200" y2="576"/>
